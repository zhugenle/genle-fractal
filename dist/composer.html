<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><title>genle_fractal — formula workspace</title><link rel="stylesheet" href="uber.css"><link rel="stylesheet" href="composer.css"></head><body class="composer-app">
<header class="workspace-header"><a href="./" class="wordmark">genle_fractal<span>_</span></a><h1>自由公式工作台</h1><div class="header-actions"><details id="new-menu"><summary>＋ 新建</summary><div class="menu"><button data-new="blank">空白画布</button><button data-new="uber">UBER 起步图</button><button data-new="cube">CUBE 起步图</button><button data-new="hybrid">折叠 × 球面幂</button><button id="duplicate-document">复制当前文档</button><button id="restore-document">恢复关闭的文档</button></div></details><button id="save-project">保存项目</button><button id="import-project">导入</button><input id="workspace-file" type="file" accept=".json,application/json" hidden><a href="./">[ 工作室 ]</a><input id="composer-accent" type="color" aria-label="界面主题色" value="#b1ff49"></div></header>
<nav id="document-tabs" class="document-tabs" role="tablist" aria-label="公式文档"></nav>
<main id="workspace-layout" class="workspace-layout"><section class="preview-panel" aria-label="三维预览"><div class="panel-heading"><span>3D 预览</span><div><button id="reference-camera" title="参考视角">[ ref ]</button><button id="top-camera" title="正俯视">[ +Y ]</button><button id="bottom-camera" title="正仰视">[ −Y ]</button><button id="preview-maximize" aria-pressed="false">展开 3D</button></div></div><div class="preview-stage"><canvas id="graph-preview" tabindex="0" aria-label="当前公式三维预览；拖动旋转，滚轮缩放"></canvas><div id="preview-empty"><p>开始一份新公式</p><button data-new="uber">从 UBER 起步</button><button data-new="cube">从 CUBE 起步</button><button id="empty-add-input">添加状态输入</button></div><span id="preview-badge" role="status">正在初始化</span></div><div class="preview-toolbar"><label>画质 <select id="graph-quality"><option value="0">流畅</option><option value="1" selected>标准</option><option value="1.5">细致</option><option value="2">精细</option><option value="3">超精细</option></select></label><button id="graph-png">保存 PNG</button><button id="recover-preview">恢复预览</button></div><div class="document-actions"><input id="formula-name" aria-label="公式名称" maxlength="80" placeholder="公式名称"><button id="export-formula">导出公式包</button><button id="open-studio">工作室打开</button><button id="export-graph">导出节点图</button></div><details class="diagnostics"><summary>运行诊断</summary><pre id="runtime-diagnostics">尚无绘制</pre></details></section>
<div id="workspace-divider" class="workspace-divider" role="separator" tabindex="0" aria-label="调整预览与画布宽度" aria-orientation="vertical"></div>
<section class="graph-panel" aria-label="节点编辑器"><div class="graph-toolbar"><button id="add-node">＋ 添加节点</button><button id="undo-graph" aria-label="撤销">撤销</button><button id="redo-graph" aria-label="重做">重做</button><button id="fit-composer">全图</button><button id="focus-selection">定位</button><button id="auto-layout">整理</button><button id="delete-selection">删除选择</button><button id="toggle-inspector" aria-expanded="false">高级设置</button><output id="composer-zoom">100%</output></div><div id="composer-canvas" tabindex="0" role="region" aria-label="节点画布；拖线连接，空格拖动平移，滚轮缩放"><div id="composer-world"><svg id="composer-wires" width="1" height="1" aria-label="算子连接"></svg><div id="composer-nodes"></div></div><div id="blank-hint"><h2>空白画布</h2><p>添加状态输入、运算与距离输出，或从起步图新建。</p><button id="blank-add">＋ 添加第一个节点</button></div><div id="selection-box" hidden></div></div><section id="node-library" class="node-library" hidden aria-label="节点库"><div class="library-heading"><input id="node-search" type="search" placeholder="搜索功能或节点名称…" aria-label="搜索节点"><button id="close-library">关闭</button></div><div id="library-items"></div></section><div class="graph-foot"><span id="connection-status">拖动端口接线 · 空格拖动平移 · Shift+A 添加</span><span id="node-count">0 个节点</span></div></section>
<aside id="composer-inspector" class="composer-inspector" hidden aria-label="高级检查器"><div class="panel-heading"><span>高级设置</span><button id="close-inspector">关闭</button></div><div id="node-inspector"></div></aside></main><footer class="workspace-status"><span id="compile-status" role="status">正在恢复工作区…</span><span id="save-status">本地草稿</span></footer><script src="graph.js"></script><script src="graph-state.js"></script><script src="graph-preview.js"></script><script src="composer.js"></script></body></html>
